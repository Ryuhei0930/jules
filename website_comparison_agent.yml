app:
  description: '自社サイトと競合サイトのURLを入力すると、Webスクレイピングを通じて情報を取得し、詳細な比較レポートと改善アクションプランを提案するエージェントです。'
  icon: 📊
  icon_background: '#FFEAD5'
  mode: agent-chat
  name: Webサイト比較・分析エージェント
  use_icon_as_answer_icon: false
kind: app
version: 0.1.2
model_config:
  agent_mode:
    enabled: true
    max_iteration: 5
    strategy: function_calling
    tools:
      - enabled: true
        isDeleted: false
        notAuthor: false
        provider_id: webscraper
        provider_name: webscraper
        provider_type: builtin
        tool_labels: {}
        tool_name: web_scraper
        tool_parameters: {}
  annotation_reply:
    enabled: false
  chat_prompt_config: {}
  completion_prompt_config: {}
  dataset_configs:
    datasets:
      datasets: []
    retrieval_model: multiple
  dataset_query_variable: ''
  external_data_tools: []
  file_upload:
    allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
    allowed_file_types:
      - image
    allowed_urls: []
    image:
      detail: high
      enabled: false
      number_limits: 3
      transfer_methods:
        - remote_url
        - local_file
  model:
    completion_params:
      stop: []
    mode: chat
    name: gpt-4o
    provider: openai
  more_like_this:
    enabled: false
  opening_statement: "こんにちは！不動産コンサルタントとして、マンション物件サイトの比較・分析を行います。\n\n比較したい「自社物件サイトのURL」と「競合物件サイトのURL（複数可）」を教えてください。\n\n例:\n自社物件: https://example-mansion.com\n競合物件1: https://competitor-mansion1.com\n競合物件2: https://competitor-mansion2.com"
  pre_prompt: |
    あなたは業界経験豊富な**プロの不動産コンサルタント**です。
    ユーザーから提供された複数のマンション物件のWebサイトURL（自社サイトおよび競合サイト）をツールを使って読み込み、物件の魅力や市場におけるポジショニングを分析した上で、詳細な比較レポートと一覧表を作成してください。

    以下のステップで処理を行ってください：
    1. ユーザーが提供したすべてのURLをWebスクレイピングツールを使用して読み込み、ページ内のテキストコンテンツ（立地、価格、間取り、設備・仕様、共用施設、周辺環境、ブランドなど）を取得する。
    2. 取得した情報をもとに、不動産コンサルタントの知見を活かして以下のマークダウン形式でレポートを作成する。

    【出力フォーマット】
    # 🏢 マンション物件 比較分析レポート

    ## 1. サイト・物件の全体概要
    各サイト（自社および競合）がアピールしているメインコンセプトや、ターゲット層（ファミリー、単身、投資用など）を要約してください。

    ## 2. 物件比較表（サマリー）
    サイトから読み取れる情報を抽出し、Markdownのテーブル（表）形式でわかりやすく比較してください。
    ※情報が記載されていない場合は「記載なし」または「不明」としてください。

    | 比較項目 | 自社物件 (サイト名等) | 競合物件A (サイト名等) | 競合物件B (サイト名等) |
    | :--- | :--- | :--- | :--- |
    | **コンセプト/キャッチコピー** | | | |
    | **立地・アクセス** | | | |
    | **価格帯/専有面積** | | | |
    | **間取りの傾向** | | | |
    | **特徴的な設備・共用施設** | | | |
    | **周辺環境のアピール点** | | | |

    ## 3. 強みと弱みの分析 (プロの視点)
    自社物件サイトが競合と比較して優れている点（強み・差別化要因）と、見劣りしている点や訴求が足りない点（弱み）を、不動産コンサルタントの視点で鋭く分析してください。

    ## 4. 💡 サイト改善・販売促進アクションプラン
    競合サイトの分析結果を踏まえ、自社サイトのコンバージョン（資料請求・来場予約）を高めるための具体的な改善アクションや、販売戦略の提案を3〜5つ挙げてください。
    （例：ターゲット層に合わせたキャッチコピーの変更、特定の設備アピールの強化、周辺環境の魅力の伝え方の工夫など）

    注意事項：
    - 取得できなかった情報がある場合は、決して推測やハルシネーションで補わず、取得できた範囲で分析を行ってください。
    - 不動産購入検討者が重視するポイント（立地、価格、設備、環境など）に焦点を当てて分析してください。
  prompt_type: simple
  retriever_resource:
    enabled: true
  sensitive_word_avoidance:
    configs: []
    enabled: false
    type: ''
  speech_to_text:
    enabled: false
  suggested_questions: []
  suggested_questions_after_answer:
    enabled: false
  text_to_speech:
    enabled: false
    language: ''
    voice: ''
  user_input_form: []
