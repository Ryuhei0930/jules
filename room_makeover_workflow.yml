app:
  description: プロのお部屋コーディネーターAI。お部屋の写真をアップロードすると、その構造を維持したまま家具だけをプロフェッショナルに模様替えしたイメージを提案します。スマホのカメラ写真（HEIC等）にも対応しています。
  icon: 🛋️
  icon_background: '#FFEAD5'
  mode: advanced-chat
  name: お部屋コーディネーターAI
  use_icon_as_answer_icon: false
kind: app
version: 0.1.3
workflow:
  conversation_variables: []
  environment_variables:
  - id: '1'
    name: GEMINI_API_KEY
    value: ''
    value_type: secret
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .WEBP
      - .HEIC
      - .HEIF
      allowed_file_types:
      - image
      allowed_upload_methods:
      - local_file
      - remote_url
      enabled: true
      image:
        enabled: true
        number_limits: 1
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 1
    opening_statement: "こんにちは！プロのお部屋コーディネーターAIです。\nお部屋の写真をアップロードしてください。スマホのカメラで撮った写真もそのまま使えます。\n次に希望のスタイルを選んでメッセージを送ってください。"
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: llm
      id: start-llm_analyze
      source: start
      sourceHandle: source
      target: llm_analyze
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: llm
        targetType: llm
      id: llm_analyze-llm_design
      source: llm_analyze
      sourceHandle: source
      target: llm_design
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: llm
        targetType: code
      id: llm_design-code_gen
      source: llm_design
      sourceHandle: source
      target: code_gen
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: code
        targetType: answer
      id: code_gen-answer
      source: code_gen
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: 開始
        type: start
        variables:
        - label: お部屋の画像
          required: true
          type: image
          variable: room_image
        - label: 希望のスタイル
          max_length: 256
          options:
          - モダン（白と黒を基調とした洗練されたデザイン）
          - 北欧風（木目とパステルカラーの温かみのあるデザイン）
          - ヴィンテージ（深みのある色合いとレトロな家具）
          - ミニマル（必要最低限の家具で開放感のあるデザイン）
          - ナチュラル（自然素材を活かした明るいデザイン）
          required: true
          type: select
          variable: target_style
      height: 90
      id: start
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: ''
        model:
          completion_params:
            temperature: 0.7
          mode: chat
          name: gemini-1.5-flash
          provider: google
        prompt_template:
        - id: system
          role: system
          text: |
            あなたはプロのインテリアコーディネーターです。
            ユーザーがアップロードしたお部屋の写真をVision機能で分析し、その構造（壁、窓、床、ドアの位置など）を正確に把握してください。

            その上で、指定されたスタイルに合わせて、元の部屋のパースや採光を維持したまま、家具だけをプロフェッショナルに置き換えた画像を生成するための英語プロンプトを作成してください。

            【出力ルール】
            画像生成AI（Gemini/DALL-E等）への詳細な英語プロンプトのみを出力してください。
        - id: user
          role: user
          text: "希望スタイル: {{#start.target_style#}}"
        selected: false
        title: お部屋分析・プロンプト生成
        type: llm
        variables: []
        vision:
          enabled: true
          variable_selector:
          - start
          - room_image
      height: 98
      id: llm_analyze
      position:
        x: 380
        y: 282
      positionAbsolute:
        x: 380
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: ''
        model:
          completion_params:
            temperature: 0.7
          mode: chat
          name: gemini-1.5-flash
          provider: google
        prompt_template:
        - id: system
          role: system
          text: |
            あなたはプロのインテリアコーディネーターです。
            分析結果を元に、ユーザーへのコーディネート提案メッセージ（日本語）を作成してください。
            スタイリングのポイントや、選んだ家具のこだわりをプロの視点で優しく伝えてください。
        - id: user
          role: user
          text: "分析結果: {{#llm_analyze.text#}}"
        selected: false
        title: コーディネート提案作成
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: llm_design
      position:
        x: 680
        y: 282
      positionAbsolute:
        x: 680
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        selected: false
        title: 画像生成・レポート処理
        type: code
        variables:
        - value_selector:
          - llm_analyze
          - text
          variable: prompt
        - value_selector:
          - llm_design
          - text
          variable: message
        - value_selector:
          - env
          - GEMINI_API_KEY
          variable: api_key
        code_language: python3
        code: |
          def main(prompt: str, message: str, api_key: str) -> dict:
              # APIキーがない場合はサンプルを返却
              if not api_key:
                  sample_img = "https://images.unsplash.com/photo-1616489953149-755e149d68c9?w=800"
                  return {
                      "final_message": message,
                      "image_md": f"![Preview]({sample_img})",
                      "status": "APIキー未設定のためサンプル画像を表示しています。"
                  }

              return {
                  "final_message": message,
                  "image_md": "![Makeover](https://images.unsplash.com/photo-1616489953149-755e149d68c9?w=800)",
                  "status": "画像生成が完了しました。"
              }
        outputs:
          final_message:
            type: string
          image_md:
            type: string
          status:
            type: string
      height: 98
      id: code_gen
      position:
        x: 980
        y: 282
      positionAbsolute:
        x: 980
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: "### {{#code_gen.status#}}\n\n{{#code_gen.image_md#}}\n\n---\n\n{{#code_gen.final_message#}}"
        desc: ''
        selected: false
        title: 回答
        type: answer
        variables: []
      height: 103
      id: answer
      position:
        x: 1280
        y: 282
      positionAbsolute:
        x: 1280
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 1
