app:
  description: '自社物件と競合物件のURL（最大2つ）を入力すると、自動でWebページの内容を読み取り、プロの不動産コンサルタントの視点で比較・分析レポートを作成するワークフローです。'
  icon: 🏢
  icon_background: '#FFEAD5'
  mode: advanced-chat
  name: 不動産Webサイト比較ワークフロー
  use_icon_as_answer_icon: false
kind: app
version: 0.1.2
workflow:
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
        - .JPG
        - .JPEG
        - .PNG
        - .GIF
        - .WEBP
        - .SVG
      allowed_file_types:
        - image
      allowed_urls: []
      image:
        detail: high
        enabled: false
        number_limits: 3
        transfer_methods:
          - remote_url
          - local_file
    opening_statement: "こんにちは！不動産コンサルタントとして、マンション物件サイトの比較・分析を行います。\n\n「自社物件サイトのURL」と「競合物件サイトのURL（最大2つ）」を入力してください。\n\n※URL以外の文字を入れると正しく読み取れない場合がありますので、URLのみをご入力ください。"
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      configs: []
      enabled: false
      type: ''
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
      - data:
          sourceType: start
          targetType: http-request
        id: start-source-my_site_http-target
        source: start
        target: my_site_http
      - data:
          sourceType: start
          targetType: http-request
        id: start-source-comp_site1_http-target
        source: start
        target: comp_site1_http
      - data:
          sourceType: start
          targetType: http-request
        id: start-source-comp_site2_http-target
        source: start
        target: comp_site2_http
      - data:
          sourceType: http-request
          targetType: llm
        id: my_site_http-source-llm-target
        source: my_site_http
        target: llm
      - data:
          sourceType: http-request
          targetType: llm
        id: comp_site1_http-source-llm-target
        source: comp_site1_http
        target: llm
      - data:
          sourceType: http-request
          targetType: llm
        id: comp_site2_http-source-llm-target
        source: comp_site2_http
        target: llm
      - data:
          sourceType: llm
          targetType: answer
        id: llm-source-answer-target
        source: llm
        target: answer
    nodes:
      - data:
          desc: ''
          selected: false
          title: 開始
          type: start
          variables:
            - label: 自社物件URL
              max_length: 256
              options: []
              required: true
              type: text-input
              variable: my_url
            - label: 競合物件URL 1
              max_length: 256
              options: []
              required: true
              type: text-input
              variable: comp_url_1
            - label: 競合物件URL 2 (任意)
              max_length: 256
              options: []
              required: false
              type: text-input
              variable: comp_url_2
        height: 142
        id: start
        position:
          x: 80
          y: 282
        positionAbsolute:
          x: 80
          y: 282
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          authorization:
            config: null
            type: no-auth
          body:
            data: ''
            type: none
          desc: ''
          headers: ''
          method: get
          params: ''
          selected: false
          timeout:
            connect: 10
            read: 60
            write: 10
          title: 自社サイト取得(Jina Reader)
          type: http-request
          url: https://r.jina.ai/{{#start.my_url#}}
          variables: []
        height: 106
        id: my_site_http
        position:
          x: 400
          y: 80
        positionAbsolute:
          x: 400
          y: 80
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          authorization:
            config: null
            type: no-auth
          body:
            data: ''
            type: none
          desc: ''
          headers: ''
          method: get
          params: ''
          selected: false
          timeout:
            connect: 10
            read: 60
            write: 10
          title: 競合サイト1取得(Jina Reader)
          type: http-request
          url: https://r.jina.ai/{{#start.comp_url_1#}}
          variables: []
        height: 106
        id: comp_site1_http
        position:
          x: 400
          y: 282
        positionAbsolute:
          x: 400
          y: 282
        selected: false
        sourcePosition: right
        targetPosition: left
