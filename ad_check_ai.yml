app:
  name: 広告チェックAI（クライアント切替対応）
  description: "新築分譲マンション広告（チラシPDF）を対象に、  近畿地区不動産公正取引協議会ルールおよび  クライアント別広告レギュレーションに基づき、\
    \  NG／要注意を色分けし修正案まで提示する社内チェック用AI。 \n"
  mode: workflow
  icon: ✅
  icon_background: '#EEF2FF'
  version: 0.1.0
kind: app
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: true
      allowed_file_types:
      - document
      allowed_file_extensions:
      - .pdf
      number_limits: 1
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - id: start-extract_text
      source: start
      sourceHandle: source
      target: extract_text
      targetHandle: target
      type: custom
      zIndex: 0
    - id: extract_text-llm_structuring
      source: extract_text
      sourceHandle: source
      target: llm_structuring
      targetHandle: target
      type: custom
      zIndex: 0
    - id: llm_structuring-knowledge-retrieval
      source: llm_structuring
      sourceHandle: source
      target: knowledge-retrieval
      targetHandle: target
      type: custom
      zIndex: 0
    - id: knowledge-retrieval-llm_check
      source: knowledge-retrieval
      sourceHandle: source
      target: llm_check
      targetHandle: target
      type: custom
      zIndex: 0
    - id: llm_check-end
      source: llm_check
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - id: start
      positionAbsolute:
        x: 80
        y: 282
      selected: false
      type: start
      data:
        title: 開始
        type: start
        variables:
        - name: client
          type: select
          required: true
          options:
          - A社
          - B社
          - C社
          label: クライアント名
        - name: ad_pdf
          type: file
          required: true
          label: 広告データ（PDF）
    - id: extract_text
      positionAbsolute:
        x: 380
        y: 282
      selected: false
      type: document-extractor
      data:
        title: PDFテキスト抽出
        type: document-extractor
        variable_selector:
        - start
        - ad_pdf
    - id: llm_structuring
      positionAbsolute:
        x: 680
        y: 282
      selected: false
      type: llm
      data:
        title: 広告内容構造化
        type: llm
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            temperature: 0.7
          mode: chat
          name: gpt-4.1
          provider: openai
        prompt_template:
        - role: system
          text: "あなたは新築分譲マンション広告の内容整理担当です。 \n以下の広告内容を、広告チェックがしやすいように構造化してください。 \n\n\
            【抽出項目】 \n・物件名 \n・所在地 \n・交通 \n・販売価格・価格帯 \n・販売戸数 \n・専有面積 \n・広告内の強調表現・断定表現\
            \ \n・注釈・※表記 \n・その他、判断に影響する表現 \n\n推測は禁止し、記載がない場合は「記載なし」と明記してください。 \n"
        - role: user
          text: "{{#extract_text.text#}} \n"
        vision:
          enabled: false
    - id: knowledge-retrieval
      positionAbsolute:
        x: 980
        y: 282
      selected: false
      type: knowledge-retrieval
      data:
        dataset_ids:
        - <placeholder_dataset_id>
        query_variable_selector:
        - llm_structuring
        - text
        title: 知識取得
        type: knowledge-retrieval
    - id: llm_check
      positionAbsolute:
        x: 1280
        y: 282
      selected: false
      type: llm
      data:
        title: 広告チェック（NG／要注意判定）
        type: llm
        context:
          enabled: true
          variable_selector:
          - knowledge-retrieval
          - result
        model:
          completion_params:
            temperature: 0.7
          mode: chat
          name: gpt-4.1
          provider: openai
        prompt_template:
        - role: system
          text: "あなたは新築分譲マンション広告の社内チェック担当です。 \n\n【必須ルール】 \n・近畿地区不動産公正取引協議会の規約を最優先で適用する\
            \ \n・加えて、選択されたクライアントの広告レギュレーションを適用する \n・ナレッジに記載のない事項は推測・断定しない \n・「完全に合法」「絶対OK」などの断定は禁止\
            \ \n\n【関連知識】\n{{#knowledge-retrieval.result#}}\n\n【現在のクライアント】 \n{{#start.client#}}\
            \ \n\n【出力形式】 \nHTMLのみで出力してください（前置き・挨拶なし）。 \nNGは赤、要注意はオレンジで表示してください。 \n\
            各指摘には必ず「指摘内容／根拠／修正案」を含めてください。 \n\n--- HTML START --- \n<h2>広告チェック結果</h2>\
            \ \n\n<div style=\"margin-bottom:12px;color:#555;\"> \n  対象クライアント：<b>{{#start.client#}}</b>\
            \ \n</div> \n\n<div style=\"padding:12px;border:1px solid #ddd;border-radius:8px;margin-bottom:16px;\"\
            > \n  <b>総評：</b> \n  全体的なリスク評価を1〜3文で記載してください。 \n</div> \n\n<!-- 指摘カードを以下形式で繰り返す\
            \ --> \n\n<div style=\"padding:12px;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:10px;\"\
            > \n  <div style=\"display:flex;gap:8px;align-items:center;margin-bottom:6px;\"\
            > \n    <span style=\"background:#fee2e2;color:#991b1b; \n           \
            \      padding:2px 8px;border-radius:999px;font-weight:bold;\"> \n   \
            \   NG \n    </span> \n    <b>指摘タイトル</b> \n  </div> \n  <div><b>指摘内容：</b>内容</div>\
            \ \n  <div><b>根拠：</b>規約名・条文</div> \n  <div><b>修正案：</b>修正後の広告表現</div> \n\
            </div> \n\n<div style=\"padding:12px;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:10px;\"\
            > \n  <div style=\"display:flex;gap:8px;align-items:center;margin-bottom:6px;\"\
            > \n    <span style=\"background:#ffedd5;color:#9a3412; \n           \
            \      padding:2px 8px;border-radius:999px;font-weight:bold;\"> \n   \
            \   要注意 \n    </span> \n    <b>指摘タイトル</b> \n  </div> \n  <div><b>指摘内容：</b>内容</div>\
            \ \n  <div><b>根拠：</b>規約名・条文</div> \n  <div><b>修正案：</b>修正後の広告表現</div> \n\
            </div> \n\n--- HTML END --- \n"
        - role: user
          text: "{{#llm_structuring.text#}} \n"
        vision:
          enabled: false
    - id: end
      positionAbsolute:
        x: 1580
        y: 282
      selected: false
      type: end
      data:
        title: 結果出力
        type: end
        outputs:
        - value_selector:
          - llm_check
          - text
          variable: result
