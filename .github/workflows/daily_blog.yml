name: Daily AI News Blog Generator

on:
  schedule:
    # JST 8:00 AM is UTC 11:00 PM the previous day.
    # So 23:00 UTC = 08:00 JST.
    - cron: '0 23 * * *'
  workflow_dispatch: # 手動実行用ボタン

jobs:
  generate_and_post:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install feedparser google-genai playwright python-dotenv
        playwright install chromium
        playwright install-deps chromium

    - name: Run script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        NOTE_EMAIL: ${{ secrets.NOTE_EMAIL }}
        NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
      run: |
        python main.py
