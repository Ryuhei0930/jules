name: Daily AI Blog Automation

on:
  schedule:
    # 8:00 AM JST = 23:00 UTC (previous day)
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      working-directory: ./AutoBlog-GitHub
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright Browsers
      run: |
        playwright install chromium
        playwright install-deps

    - name: Run Daily Blog Script
      working-directory: ./AutoBlog-GitHub
      env:
        RSS_URL: ${{ secrets.RSS_URL }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        NOTE_EMAIL: ${{ secrets.NOTE_EMAIL }}
        NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
        GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
      run: python main.py

    - name: Upload Artifacts (Screenshots/Logs)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: debug-screenshots
        path: "*.png"
