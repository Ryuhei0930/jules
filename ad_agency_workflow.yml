app:
  description: 優秀な調査企画提案をしてくれる広告代理店のアカウントエグゼクティブAI。3種類の生成AIで市場調査を行い、その結果を要約して市場調査レポートを作成。レポートをもとに3つのAIがそれぞれ3案ずつ企画案を提出し、別のAIが採点コメントを付けて最終3つに絞る。最後に上位3つの企画案から、起承転結の構成で提案書を作成します。
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: workflow
  name: 広告代理店 企画提案AI
  use_icon_as_answer_icon: false
kind: app
version: 0.1.3
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        image_resolution_limit: 720
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
