        - id: user
          role: user
          text: "【依頼内容】\n{{#start.request_content#}}\n\n【市場調査レポート】\n{{#llm_summary.text#}}\n\n【上位3つの企画案と選定理由】\n{{#llm_evaluate.text#}}"
