    - data:
        desc: '最終提案書の内容をHTML形式のファイルに変換し、ダウンロード可能にします。これをブラウザで開いて「PDFとして印刷・保存」することで綺麗なPDF資料になります。'
        selected: false
        title: HTMLファイル変換 (PDF保存用)
        type: code
        variables:
        - value_selector:
          - llm_proposal
          - text
          variable: proposal_text
        code_language: python3
        code: |
          def main(proposal_text: str) -> dict:
              import base64
              import json

              # 構文エラー（f-string内での\の利用）を防ぐため事前に改行コードを置換
              formatted_text = proposal_text.replace('\n', '<br>')

              # Markdownを簡易的なHTMLに変換
              html_content = f"""
              <!DOCTYPE html>
              <html lang="ja">
              <head>
                  <meta charset="UTF-8">
                  <title>企画提案書</title>
                  <style>
                      body {{ font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; line-height: 1.6; padding: 40px; color: #333; }}
                      h1, h2, h3 {{ color: #2c3e50; border-bottom: 1px solid #eee; padding-bottom: 10px; }}
                      p {{ margin-bottom: 1em; white-space: pre-wrap; }}
                  </style>
              </head>
              <body>
                  <h1>広告代理店 企画提案書</h1>
                  <div>
                      {formatted_text}
                  </div>
              </body>
              </html>
              """

              # Base64のData URIスキームを作成してマークダウンリンクとして出力
              html_bytes = html_content.encode('utf-8')
              html_base64 = base64.b64encode(html_bytes).decode('utf-8')
              data_uri = f"data:text/html;base64,{html_base64}"

              # クリックして新しいタブで開けるリンクを生成
              download_link = f"📄 **[提案書（HTML版）を開く・PDFとして保存する]({data_uri})**"

              return {
                  "result_file_link": download_link
              }
        outputs:
          result_file_link:
            type: string
            children: null
      height: 98
      id: code_output
      position:
        x: 1880
        y: 350
      positionAbsolute:
        x: 1880
        y: 350
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
